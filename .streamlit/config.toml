[server]
# Menaikkan batas ukuran pesan WebSocket (default 25 MB) supaya file
# besar (misal gambar 10-20 MB) tidak gagal saat ditampilkan/diunduh.
# Nilai dalam MB.
maxMessageSize = 250

# Batas maksimum ukuran file yang bisa diupload lewat st.file_uploader
# (default 200 MB, dinaikkan sedikit untuk jaga-jaga).
maxUploadSize = 250

[theme]
# Tema "Vault/Cipher Terminal" — diterapkan di level Streamlit supaya
# konsisten di SELURUH komponen native, tidak bentrok lagi dengan
# toggle Light/Dark bawaan Streamlit (menu titik tiga > Settings > Theme).
base = "dark"
primaryColor = "#C9A227"
backgroundColor = "#0F1115"
secondaryBackgroundColor = "#171A21"
textColor = "#E7E4DD"
font = "sans serif"
